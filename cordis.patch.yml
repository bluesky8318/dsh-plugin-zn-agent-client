# dsh-plugin-zn-agent-client 的 bundle 配置层：装进 profile 后生效。
# 行 id 是宿主派生 settings 命名空间时用的 id，也是客户端在 Plugins 页上
# 贡献配置页时用的键，三处必须一致。
- insert:
    - id: dsh-plugin-zn-agent-client
      name: dsh-plugin-zn-agent-client
      config:
        # ACP agent 清单；装好后可在设置 → 插件 里编辑。
        # 最小条目示例：
        # agents:
        #   - id: claude-code
        #     displayName: Claude Code
        #     command: claude-agent-acp
        #     args: []
        #     workingDirectory: /Users/leon/work
        agents: []
        defaultAgent: ''
        autoAllowPermissions: false
        logEvents: false
